<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 204" role="img" aria-labelledby="title desc">
  <title id="title">Stack em movimento</title>
  <desc id="desc">Duas faixas em movimento exibem tecnologias e ferramentas usadas em projetos, estudos e trabalho.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop stop-color="#171914"/>
      <stop offset="1" stop-color="#11130f"/>
    </linearGradient>
    <linearGradient id="fade">
      <stop stop-color="#171914"/>
      <stop offset=".1" stop-color="#171914" stop-opacity="0"/>
      <stop offset=".9" stop-color="#171914" stop-opacity="0"/>
      <stop offset="1" stop-color="#171914"/>
    </linearGradient>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="202" rx="20"/></clipPath>
  </defs>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .mono{font-family:"SFMono-Regular",Consolas,monospace}
    .track-a{animation:left 32s linear infinite}
    .track-b{animation:right 36s linear infinite}
    .chip{fill:#1b2017;stroke:#e7f1d0;stroke-opacity:.16}
    .label{fill:#e8ebdf;font-size:14px}
    .code{fill:#d9ff52;font-size:13px}
    @keyframes left{to{transform:translateX(-1153px)}}
    @keyframes right{from{transform:translateX(-1138px)}to{transform:translateX(0)}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
