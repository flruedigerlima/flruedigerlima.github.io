<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 226" role="img" aria-labelledby="title desc">
  <title id="title">Fluig Tracker: exportação com histórico Git automático</title>
  <desc id="desc">Uma linha animada conecta Fluig, exportação concluída, Git commit, Git push e GitHub.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop stop-color="#191d16"/>
      <stop offset="1" stop-color="#11130f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#64723c"/>
      <stop offset=".48" stop-color="#d9ff52"/>
      <stop offset="1" stop-color="#64723c"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .mono{font-family:"SFMono-Regular",Consolas,monospace}
    .dash{stroke-dasharray:10 15;animation:flow 1.2s linear infinite}
    .packet{animation:travel 6s linear infinite}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    .node{animation:glow 2.4s ease-in-out infinite}
    .n2{animation-delay:.35s}.n3{animation-delay:.7s}.n4{animation-delay:1.05s}.n5{animation-delay:1.4s}
    .packet.p2{animation-delay:3s}
    .cursor{animation:blink 1s steps(2,end) infinite}
    @keyframes flow{to{stroke-dashoffset:-50}}
    @keyframes travel{from{transform:translateX(0);opacity:0}8%{opacity:1}90%{opacity:1}to{transform:translateX(860px);opacity:0}}
    @keyframes ring{0%{transform:scale(.7);opacity:.75}100%{transform:scale(1.9);opacity:0}}
    @keyframes glow{50%{filter:brightness(1.35)}}
    @keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
  <rect width="1200" height="226" rx="22" fill="url(#bg)" stroke="#f4f2e9" stroke-opacity=".13"/>
  <path d="M92 104H1108" stroke="#3c4330" stroke-width="3" stroke-linecap="round"/>
  <path class="dash" d="M92 104H1108" stroke="url(#line)" stroke-width="3" stroke-linecap="round"/>
  <g class="packet" fill="#eaff9c" filter="url(#glow)"><circle cx="92" cy="104" r="5"/></g>
  <g class="packet p2" fill="#eaff9c" filter="url(#glow)"><circle cx="92" cy="104" r="4"/></g>
  <g text-anchor="middle">
    <g transform="translate(120 104)">
      <circle class="ring" r="34" fill="none" stroke="#d9ff52" stroke-opacity=".7"/>
      <circle class="node" r="27" fill="#20271a" stroke="#d9ff52" stroke-width="1.5"/>
      <path d="M-9-10c-2 8 1 17 9 22 8-5 11-14 9-22L0-15z" fill="none" stroke="#d9ff52" stroke-width="2"/>
      <text y="59" fill="#f4f2e9" font-size="14" font-weight="700">TOTVS Fluig</text>
      <text y="78" fill="#a5a89a" font-size="11" class="mono">ORIGEM</text>
    </g>
    <g transform="translate(360 104)">
      <circle class="ring" r="34" fill="none" stroke="#d9ff52" stroke-opacity=".7" style="animation-delay:.35s"/>
      <circle class="node n2" r="27" fill="#20271a" stroke="#d9ff52" stroke-width="1.5"/>
      <path d="m-10 0 7 7L11-8" fill="none" stroke="#d9ff52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="59" fill="#f4f2e9" font-size="14" font-weight="700">Exportação</text>
      <text y="78" fill="#a5a89a" font-size="11" class="mono">CONCLUÍDA</text>
    </g>
    <g transform="translate(600 104)">
      <circle class="ring" r="34" fill="none" stroke="#d9ff52" stroke-opacity=".7" style="animation-delay:.7s"/>
      <circle class="node n3" r="27" fill="#20271a" stroke="#d9ff52" stroke-width="1.5"/>
      <path d="m-10-7 10-5 10 5v13L0 13l-10-7zM-10-7 0-1l10-6M0-1v14" fill="none" stroke="#d9ff52" stroke-width="1.7" stroke-linejoin="round"/>
      <text y="59" fill="#f4f2e9" font-size="14" font-weight="700">Git commit</text>
      <text y="78" fill="#d9ff52" font-size="11" class="mono">AUTOMÁTICO</text>
    </g>
    <g transform="translate(840 104)">
      <circle class="ring" r="34" fill="none" stroke="#d9ff52" stroke-opacity=".7" style="animation-delay:1.05s"/>
      <circle class="node n4" r="27" fill="#20271a" stroke="#d9ff52" stroke-width="1.5"/>
      <path d="M0-12v17m-7-7 7 7 7-7M-11 11h22" fill="none" stroke="#d9ff52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="59" fill="#f4f2e9" font-size="14" font-weight="700">Git push</text>
      <text y="78" fill="#d9ff52" font-size="11" class="mono">AUTOMÁTICO</text>
    </g>
    <g transform="translate(1080 104)">
      <circle class="ring" r="34" fill="none" stroke="#d9ff52" stroke-opacity=".7" style="animation-delay:1.4s"/>
      <circle class="node n5" r="27" fill="#20271a" stroke="#d9ff52" stroke-width="1.5"/>
      <path d="M0-11a11 11 0 0 0-3 22c2 0 2-1 2-2v-3c-5 1-6-2-6-2-1-2-2-2-2-2m12 5v-3c0-2-.7-3-1.5-3 5-.5 9-2.5 9-8a6 6 0 0 0-1.7-4.3c.2-.5.7-2.1-.2-4.2 0 0-1.4-.4-4.4 1.7a15 15 0 0 0-8 0C-7-16-8.4-15.6-8.4-15.6c-.9 2.1-.4 3.7-.2 4.2A6 6 0 0 0-10.3-7c0 5.5 4 7.5 9 8C-2 1.7-3 3-3 5v4" transform="scale(.7)" fill="none" stroke="#d9ff52" stroke-width="2" stroke-linecap="round"/>
      <text y="59" fill="#f4f2e9" font-size="14" font-weight="700">GitHub</text>
      <text y="78" fill="#a5a89a" font-size="11" class="mono">HISTÓRICO</text>
    </g>
  </g>
  <text x="600" y="202" text-anchor="middle" fill="#777e6a" font-size="11" letter-spacing="1.1" class="mono">CADA EXPORTAÇÃO BEM-SUCEDIDA · SEM REGISTRO MANUAL<tspan class="cursor">_</tspan></text>
</svg>
