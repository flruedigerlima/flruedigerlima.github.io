<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Felipe Ruediger Lima — perfil de desenvolvimento</title>
  <desc id="desc">Painel animado em verde-lima sobre fundo escuro, com código, produtos digitais e Fluig.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#10110e"/>
      <stop offset="1" stop-color="#1c2116"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop stop-color="#d9ff52" stop-opacity=".04"/>
      <stop offset=".5" stop-color="#d9ff52" stop-opacity=".25"/>
      <stop offset="1" stop-color="#d9ff52" stop-opacity=".02"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0v36" fill="none" stroke="#e9f1d6" stroke-opacity=".055"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="358" rx="24"/></clipPath>
  </defs>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .mono{font-family:"SFMono-Regular",Consolas,monospace}
    .grid-drift{animation:grid 28s linear infinite}
    .orbit{transform-origin:990px 177px;animation:spin 28s linear infinite}
    .orbit-reverse{transform-origin:990px 177px;animation:spin 20s linear infinite reverse}
    .float{animation:float 4s ease-in-out infinite}
    .float-late{animation:float 5s ease-in-out -2s infinite}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.6s ease-in-out infinite}
    .beam{animation:beam 5s ease-in-out infinite}
    .blink{animation:blink 1s steps(2,end) infinite}
    @keyframes grid{to{transform:translate(36px,36px)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes float{50%{transform:translateY(-7px)}}
    @keyframes pulse{50%{opacity:.42;transform:scale(.82)}}
    @keyframes beam{0%,100%{opacity:.14;transform:translateX(-190px)}50%{opacity:.52;transform:translateX(190px)}}
    @keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect class="grid-drift" width="1200" height="360" fill="url(#grid)"/>
    <ellipse cx="1000" cy="175" rx="214" ry="168" fill="#b5e936" opacity=".08" filter="url(#soft)"/>
    <rect class="beam" x="585" y="0" width="110" height="360" fill="url(#glow)" transform="rotate(15 640 180)"/>
    <path d="M0 292H760" stroke="#d9ff52" stroke-opacity=".2"/>
    <circle cx="58" cy="54" r="5" fill="#d9ff52" class="pulse"/>
    <text x="78" y="60" fill="#d9ff52" font-size="13" letter-spacing="3" class="mono">DESENVOLVIMENTO · PRODUTO · EXPERIÊNCIA</text>
    <text x="58" y="145" fill="#f4f2e9" font-size="51" font-weight="750" letter-spacing="-2.2">Ideias em construção.</text>
    <text x="60" y="190" fill="#a5a89a" font-size="21">Código com contexto. Soluções que fazem sentido.</text>
    <g class="mono" font-size="13">
      <rect x="58" y="229" width="121" height="34" rx="17" fill="#d9ff52" fill-opacity=".1" stroke="#d9ff52" stroke-opacity=".42"/>
      <text x="78" y="251" fill="#d9ff52">IFSP · TÉCNICO</text>
      <rect x="190" y="229" width="153" height="34" rx="17" fill="#f4f2e9" fill-opacity=".035" stroke="#f4f2e9" stroke-opacity=".18"/>
      <text x="209" y="251" fill="#d4d6ca">DEV · CONCILIG</text>
      <rect x="354" y="229" width="155" height="34" rx="17" fill="#f4f2e9" fill-opacity=".035" stroke="#f4f2e9" stroke-opacity=".18"/>
      <text x="374" y="251" fill="#d4d6ca">PRODUTO DIGITAL</text>
    </g>
    <text x="59" y="326" fill="#7c8174" font-size="12" letter-spacing="2.4" class="mono">FELIPE LUCAS RUEDIGER LIMA</text>
    <g fill="none" stroke="#d9ff52">
      <circle cx="990" cy="177" r="126" stroke-opacity=".14" stroke-dasharray="2 8"/>
      <circle cx="990" cy="177" r="91" stroke-opacity=".23" stroke-dasharray="48 14 4 14"/>
      <circle cx="990" cy="177" r="56" stroke-opacity=".34"/>
      <circle cx="990" cy="177" r="40" fill="#d9ff52" fill-opacity=".09" stroke-opacity=".7"/>
    </g>
    <g class="orbit">
      <circle cx="990" cy="51" r="5" fill="#d9ff52"/>
      <circle cx="1116" cy="177" r="4" fill="#f4f2e9" opacity=".85"/>
      <circle cx="990" cy="303" r="5" fill="#b9e83c"/>
    </g>
    <g class="orbit-reverse">
      <circle cx="990" cy="86" r="4" fill="#d9ff52" opacity=".7"/>
      <circle cx="1081" cy="177" r="4" fill="#d9ff52"/>
    </g>
    <g class="float">
      <path d="M977 175h9l4-12 8 27 5-15h10" fill="none" stroke="#d9ff52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="990" y="246" text-anchor="middle" fill="#dfe8c5" font-size="11" letter-spacing="2" class="mono">FLUIG × GIT</text>
    <g class="float-late">
      <rect x="805" y="90" width="88" height="34" rx="9" fill="#171914" stroke="#d9ff52" stroke-opacity=".42"/>
      <text x="849" y="112" text-anchor="middle" fill="#d9ff52" font-size="12" class="mono">.NET</text>
    </g>
    <g class="float">
      <rect x="1086" y="245" width="80" height="34" rx="9" fill="#171914" stroke="#d9ff52" stroke-opacity=".42"/>
      <text x="1126" y="267" text-anchor="middle" fill="#d9ff52" font-size="12" class="mono">JS</text>
    </g>
    <g class="mono" font-size="12">
      <text x="808" y="304" fill="#79816a">&gt; export --to fluig</text>
      <text x="808" y="322" fill="#d9ff52">✓ history tracked<tspan class="blink">_</tspan></text>
    </g>
    <circle cx="1162" cy="55" r="2" fill="#f4f2e9" class="pulse"/>
    <circle cx="795" cy="171" r="2" fill="#d9ff52" class="pulse"/>
    <circle cx="1155" cy="120" r="2" fill="#d9ff52" class="pulse"/>
    <rect x="1" y="1" width="1198" height="358" rx="24" fill="none" stroke="#f4f2e9" stroke-opacity=".14"/>
  </g>
</svg>
